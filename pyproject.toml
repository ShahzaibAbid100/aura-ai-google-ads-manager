[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-ad-manager"
version = "0.1.0"
description = "Mock-first AI-assisted Google Ads management backend"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<47",
  "pillow>=11,<13",
  "langgraph>=0.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2"]
download = ["huggingface_hub>=0.27,<2"]
qwen = ["torch>=2.5,<2.7", "transformers>=4.51.3,<4.52", "safetensors>=0.4.5"]
sd-turbo = ["torch>=2.5,<2.7", "transformers>=4.51.3,<4.52", "diffusers>=0.32.2,<0.33", "safetensors>=0.4.5"]
smolvlm = ["torch>=2.5,<2.7", "transformers>=4.51.3,<4.52", "decord>=0.6.0"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
google-ads = ["google-ads>=25,<35"]
browser = ["playwright>=1.49,<2"]
ltx-video = ["diffusers>=0.28.2,<0.33", "transformers>=4.47.2,<4.52", "sentencepiece>=0.1.96", "huggingface_hub~=0.30", "einops>=0.8", "timm>=1.0", "imageio[ffmpeg]>=2.36", "av>=13", "torchvision>=0.22,<0.23", "PyYAML>=6,<7", "safetensors>=0.4.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["real_inference: opt-in real local-model inference tests requiring downloaded weights and optional runtimes"]

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]
